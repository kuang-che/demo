<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collaborative Task Dashboard</title>
    <!-- Modern Typography: Inter Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Main Style Sheet -->
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Dashboard Header -->
        <header class="app-header">
            <div class="header-logo">
                <div class="logo-icon">
                    <i data-lucide="layers"></i>
                </div>
                <div>
                    <h1>SyncBoard</h1>
                    <p class="subtitle">Collaborative Task Workspace</p>
                </div>
            </div>
            <button class="btn btn-primary" id="btn-open-modal">
                <i data-lucide="plus"></i> New Task
            </button>
        </header>

        <!-- Stats Overview Banner -->
        <section class="stats-banner">
            <div class="stat-card">
                <div class="stat-icon icon-todo">
                    <i data-lucide="circle"></i>
                </div>
                <div class="stat-info">
                    <span class="stat-label">To Do</span>
                    <span class="stat-value" id="stat-todo-count">0</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon icon-progress">
                    <i data-lucide="play-circle"></i>
                </div>
                <div class="stat-info">
                    <span class="stat-label">In Progress</span>
                    <span class="stat-value" id="stat-progress-count">0</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon icon-done">
                    <i data-lucide="check-circle2"></i>
                </div>
                <div class="stat-info">
                    <span class="stat-label">Completed</span>
                    <span class="stat-value" id="stat-done-count">0</span>
                </div>
            </div>
            <div class="stat-card stat-progress-card">
                <span class="stat-label">Workspace Completion</span>
                <div class="progress-container">
                    <div class="progress-bar" id="project-progress-bar" style="width: 0%"></div>
                </div>
                <span class="progress-percent" id="project-progress-text">0% Done</span>
            </div>
        </section>

        <!-- Board Grid -->
        <main class="board-grid">
            <!-- TO DO COLUMN -->
            <div class="board-column" id="col-todo">
                <div class="column-header">
                    <div class="column-title-wrapper">
                        <span class="column-dot dot-todo"></span>
                        <h2>To Do</h2>
                    </div>
                    <span class="column-badge" id="badge-todo">0</span>
                </div>
                <div class="cards-container" id="container-todo">
                    <!-- Cards will be dynamically injected here -->
                </div>
            </div>

            <!-- IN PROGRESS COLUMN -->
            <div class="board-column" id="col-progress">
                <div class="column-header">
                    <div class="column-title-wrapper">
                        <span class="column-dot dot-progress"></span>
                        <h2>In Progress</h2>
                    </div>
                    <span class="column-badge" id="badge-progress">0</span>
                </div>
                <div class="cards-container" id="container-progress">
                    <!-- Cards will be dynamically injected here -->
                </div>
            </div>

            <!-- DONE COLUMN -->
            <div class="board-column" id="col-done">
                <div class="column-header">
                    <div class="column-title-wrapper">
                        <span class="column-dot dot-done"></span>
                        <h2>Done</h2>
                    </div>
                    <span class="column-badge" id="badge-done">0</span>
                </div>
                <div class="cards-container" id="container-done">
                    <!-- Cards will be dynamically injected here -->
                </div>
            </div>
        </main>
    </div>

    <!-- Create Task Modal -->
    <div class="modal-overlay" id="task-modal">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Create New Task</h3>
                <button class="btn-close" id="btn-close-modal">
                    <i data-lucide="x"></i>
                </button>
            </div>
            <form id="create-task-form">
                <div class="form-group">
                    <label for="task-title">Title</label>
                    <input type="text" id="task-title" required placeholder="e.g. Design database schema">
                </div>
                <div class="form-group">
                    <label for="task-desc">Description</label>
                    <textarea id="task-desc" rows="3" placeholder="Provide details about the task..."></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group flex-1">
                        <label for="task-status">Status</label>
                        <select id="task-status">
                            <option value="To Do">To Do</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Done">Done</option>
                        </select>
                    </div>
                    <div class="form-group flex-1">
                        <label for="task-priority">Priority</label>
                        <select id="task-priority">
                            <option value="Low">Low</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="btn-cancel-modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Create Task</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Lucide Icons Library -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="scripts/app.js"></script>
</body>
</html>
